[project]
name = "agent-ls"
version = "0.1.0"
description = "AI-powered developer environment setup agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-aws>=0.2",
    "boto3>=1.35",
    "textual>=3.0",
    "rich>=13.0",
    "slack-sdk>=3.30",
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "gitpython>=3.1",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=24.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agent-ls = "agent_ls.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/agent_ls/__main__.py" = ["E402"]  # load_dotenv() must run before imports

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
